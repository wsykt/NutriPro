# 个人健康助手 - Docker 一键部署
# 用法：
#   1) 准备模型与知识库（本机已有，按需拷贝）：
#      ai_service/models/          → 挂载到容器 /app/models
#      ai_service/knowledge/       → 挂载到容器 /app/knowledge
#      ai_service/data/            → 挂载到容器 /app/data
#   2) 配置密钥：复制 health/.env.docker.example 为 health/.env.docker 并填写 DEEPSEEK_API_KEY
#   3) docker compose --env-file .env.docker up -d --build
#   4) 访问 http://localhost:8080 （前端）
#
# 注意：本 compose 未在本机实测（本机未安装 Docker），镜像 tag / 端口按
#       DOCKER_DEPLOY.md 核对后再使用。
version: "3.9"

services:
  ai_service:
    build: ./ai_service
    container_name: health-ai-service
    ports:
      - "8002:8002"
    environment:
      # 从 .env.docker 读取（也可直接写死，但不建议提交密钥）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      RESPONSES_API_ENABLED: ${RESPONSES_API_ENABLED:-true}
      RESPONSES_API_BASE: ${RESPONSES_API_BASE:-https://api.deepseek.com}
      RESPONSES_MODEL: ${RESPONSES_MODEL:-deepseek-v4-flash}
      LLM_MODE: ${LLM_MODE:-cloud}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-7b-local:latest}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_SERVICE_PORT: "8002"
      TRANSFORMERS_OFFLINE: "1"
      SENTENCE_TRANSFORMERS_HOME: /app/models
      TORCH_HOME: /app/models
    volumes:
      # 大数据目录挂卷（模型/向量库/运行时数据），避免烧入镜像
      - ./ai_service/models:/app/models
      - ./ai_service/knowledge:/app/knowledge
      - ./ai_service/data:/app/data
    restart: unless-stopped
    # 健康检查：AI 服务启动加载 BGE 模型较慢，放宽超时
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend-health
    container_name: health-backend
    depends_on:
      ai_service:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      # Docker 网络内用服务名访问 AI 服务
      AI_SERVICE_URL: http://ai_service:8002
      JWT_SECRET: ${JWT_SECRET:-RkVCRUNBMDUyNzlDQjAzQkI0OUJBNjM4MjIxRjY3QUI=}
    volumes:
      - ./backend-health/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/api/health", "||", "exit", "1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend-health
    container_name: health-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  # 可选：容器化 Ollama（默认不启动；如需使用：docker compose --profile ollama up -d）
  # 注意：Ollama 模型目录默认在宿主机 D:\ollama\models，按需调整挂载
  # ollama:
  #   image: ollama/ollama:latest
  #   profiles: ["ollama"]
  #   container_name: health-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - /d/ollama/models:/root/.ollama
  #   restart: unless-stopped
