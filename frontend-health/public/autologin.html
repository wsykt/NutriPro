<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>Auto Login</title></head>
<body>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  // 安全加固：不内置默认口令，用户名/密码均从 URL 参数必填
  const username = q.get('u');
  const password = q.get('p');
  if (!username || !password) {
    document.body.innerHTML = '<h2>缺少参数：请在 URL 提供 ?u=用户名&p=密码</h2>';
    return;
  }
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    });
    const j = await res.json();
    if (j.code === 200 && j.data) {
      const d = j.data;
      const token = d.access_token || d.token;
      localStorage.setItem('user_token', token);
      localStorage.setItem('token', token);
      if (d.user_id != null) localStorage.setItem('currentUserId', String(d.user_id));
      document.body.innerHTML = '<h2>OK, redirecting...</h2>';
      const target = q.get('to') || '/dashboard/health-report';
      location.href = target;
    } else {
      document.body.innerHTML = '<h2>Login failed: ' + (j.message || JSON.stringify(j)) + '</h2>';
    }
  } catch (e) {
    document.body.innerHTML = '<h2>Error: ' + e.message + '</h2>';
  }
})();
</script>
</body>
</html>
